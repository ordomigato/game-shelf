name: Deploy

# Deploys production when a version tag (v1.2.0) is pushed, or a GitHub
# release is published with one. The tagged commit must be on main.
on:
  push:
    tags: ['v*.*.*']

# One deploy at a time, in order. A deploy in progress is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # lets the job sign in to AWS with GitHub's token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://d2ajc85c3zkcbv.cloudfront.net
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::787391403512:role/game-shelf-github-deploy
          aws-region: us-east-1

      # Migrations first, so the new code never runs against an old schema.
      # Migrations must stay additive: the old code keeps serving until the
      # deploy finishes.
      - name: Migrate the database
        run: npx sst shell --stage production -- drizzle-kit migrate

      - name: Deploy
        run: npx sst deploy --stage production

      - name: Smoke test
        run: |
          base=https://d2ajc85c3zkcbv.cloudfront.net
          for path in / /explore '/api/games/search?q=zelda'; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$base$path")
            echo "$status $path"
            if [ "$status" != 200 ]; then
              echo "::error::$path returned $status after the deploy"
              exit 1
            fi
          done
